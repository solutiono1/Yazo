<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Yazo</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/css/fonts.css" />
  <link rel="stylesheet" href="/css/tokens.css" />
  <link rel="stylesheet" href="/css/base.css" />
  <link rel="stylesheet" href="/css/buttons.css" />
  <link rel="stylesheet" href="/css/dashboard.css" />
</head>
<body>
  <div class="app">
    <button class="menu-toggle" id="menuToggle" type="button" aria-label="Open menu" aria-controls="sidebar" aria-expanded="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M4 7h16M4 12h16M4 17h16"/>
      </svg>
    </button>
    <div class="sidebar-backdrop" id="sidebarBackdrop"></div>

    <aside class="sidebar" id="sidebar">
      <p class="sidebar-brand"><img src="/favicon.svg" width="24" height="24" alt="" />Yazo</p>
      <ul class="sidebar-nav">
        <li>
          <a class="sidebar-link is-active" href="#">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect x="3" y="3" width="8" height="8" rx="1.5"/>
              <rect x="13" y="3" width="8" height="8" rx="1.5"/>
              <rect x="3" y="13" width="8" height="8" rx="1.5"/>
              <rect x="13" y="13" width="8" height="8" rx="1.5"/>
            </svg>
            Dashboard
          </a>
        </li>
        <li>
          <a class="sidebar-link" href="#orders">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M8 6h13M8 12h13M8 18h13"/>
              <circle cx="3.5" cy="6" r="1.2" fill="currentColor" stroke="none"/>
              <circle cx="3.5" cy="12" r="1.2" fill="currentColor" stroke="none"/>
              <circle cx="3.5" cy="18" r="1.2" fill="currentColor" stroke="none"/>
            </svg>
            Orders
          </a>
        </li>
        <li>
          <a class="sidebar-link" href="https://github.com/solutiono1/Yazo/blob/main/SECURITY.md" rel="noopener">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M12 3 4 6v5c0 5.5 8 9 8 9s8-3.5 8-9V6z"/>
            </svg>
            Security
          </a>
        </li>
      </ul>
      <div class="sidebar-foot" id="vendorFoot" hidden>
        Signed in as
        <span class="vendor-id" id="vendorIdLabel"></span>
      </div>
    </aside>

    <main class="app-main">
      <div id="keyGate" class="key-gate">
        <img class="key-gate-mark" src="/favicon.svg" width="40" height="40" alt="" />
        <h1>Your shop on Yazo</h1>
        <p>
          No sign-up form, no password. Your key to this dashboard - not an
          account - and it's yours the moment it's created.
        </p>

        <button id="createShopBtn" class="btn btn-primary key-gate-btn" type="button">
          Create your shop - it's free
        </button>

        <div class="key-gate-divider"><span>or, if you already have a key</span></div>

        <form id="existingKeyForm" class="key-gate-existing">
          <input id="keyInput" type="text" placeholder="Paste your yzm_... key" autocomplete="off" spellcheck="false" />
          <button type="submit" class="btn btn-ghost btn-sm">Continue</button>
        </form>

        <div id="newKeyReveal" class="key-gate-reveal" hidden>
          <p class="key-gate-reveal-label">This is shown once. Save it - it's the only way back in.</p>
          <code id="newKeyText"></code>
          <button id="continueToDashboard" class="btn btn-primary key-gate-btn" type="button">
            I've saved it - enter my shop
          </button>
        </div>

        <p id="keyGateError" class="key-gate-error" hidden></p>
      </div>

      <div id="dashboardRoot" hidden>
        <div class="app-topbar">
          <div>
            <p class="app-greeting">Your orders</p>
            <p class="app-sub" id="vendorSub"></p>
          </div>
        </div>
        <div class="stat-grid" id="statGrid"></div>
        <div class="order-list" id="orderList"></div>
      </div>
    </main>
  </div>

  <script src="/js/dashboard.js"></script>
</body>
</html>
